name: Deploy to GitHub Pages

# The content of main is pushed here by the private sonara repo's publish
# workflow. This job deploys whatever is on main through the Actions Pages
# path, which queues overlapping deploys instead of failing them.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Assemble site
        run: rsync -a --exclude '.git' --exclude '.github' --exclude 'README.md' ./ _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
